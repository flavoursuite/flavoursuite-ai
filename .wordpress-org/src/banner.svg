<svg xmlns="http://www.w3.org/2000/svg" width="772" height="250" viewBox="0 0 772 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0D28"/>
      <stop offset="0.55" stop-color="#191650"/>
      <stop offset="1" stop-color="#2B1F6E"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="772" height="250" fill="url(#bg)"/>

  <!-- Receding diamonds: the propose/approve queue, kept very low contrast. -->
  <g fill="none" stroke="#6D8BD6" stroke-opacity="0.18" stroke-width="2">
    <rect x="-38" y="-38" width="76" height="76" rx="18" transform="translate(636,125) rotate(45)"/>
    <rect x="-58" y="-58" width="116" height="116" rx="26" transform="translate(636,125) rotate(45)"/>
    <rect x="-78" y="-78" width="156" height="156" rx="34" transform="translate(636,125) rotate(45)"/>
  </g>

  <g transform="translate(76,125)">
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="url(#mark)" transform="rotate(45)"/>
    <path d="M -15 2 L -4 14 L 17 -11" fill="none" stroke="#0C0D28"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="152" y="117" font-family="Ubuntu, DejaVu Sans, sans-serif"
        font-size="46" font-weight="700" fill="#FFFFFF">FlavourSuite AI</text>
  <text x="154" y="153" font-family="Ubuntu, DejaVu Sans, sans-serif"
        font-size="20" fill="#93A7CC">Agents propose. You approve.</text>
</svg>
